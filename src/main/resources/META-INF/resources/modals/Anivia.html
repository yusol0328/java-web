<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니비아 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-lg-5 text-center">
                <img src="../images/Anivia.png" class="img-fluid rounded shadow-lg" alt="애니비아"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">애니비아 (Anivia)</h3>
                    <p class="text-muted fs-5">미드 / 난이도: 상</p>
                </div>
            </div>
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 빙하의 폭풍</li>
                    <li class="list-group-item">Q: 섬광 서리</li>
                    <li class="list-group-item">W: 결빙 장벽</li>
                    <li class="list-group-item">E: 냉기 폭발</li>
                    <li class="list-group-item">R: 빙하 폭풍</li>
                </ul>
                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    프렐요드의 수호 정령인 애니비아는 죽고 다시 태어나기를 반복하며 세계를 지켜왔다.
                    그녀의 얼음 마법은 적을 봉인하고 대지를 얼어붙게 만들며, 세상의 균형을 위해 싸운다.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
