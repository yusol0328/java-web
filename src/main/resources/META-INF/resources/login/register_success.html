<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 메인 페이지</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 기존 코드 자리에 연동한 css -->
    <link rel="stylesheet" href="../css/main.css">

</head>

<body>
    <!-- 새로운 네비게이션 바 (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark"> <!--검은색 네비바-->

            <button class="btn border-0" id="themeToggleBtn">
                DARK
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.leagueoflegends.com/ko-kr/news/">뉴스</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.leagueoflegends.com/ko-kr/champions/">챔피온</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../main_page_sub/download.html">다운로드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">로그인</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            외부사이트
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/"
                                    target="_blank">롤공식홈</a></li>
                            <li><a class="dropdown-item" href="https://www.deeplol.gg/aram?hl=ko"
                                    target="_blank">롤전적</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="https://www.youtube.com/@LeagueofLegends-Korea"
                                    target="_blank">간편유튜브</a></li>
                        </ul>
                    </li>
                </ul>
                <!-- 서치 폼 불필요하다고 판단되어 삭제 -->
            </div>
        </div>
    </nav>

    <section class="hero d-flex align-items-center
justify-content-center text-center py-5">
        <div class="container" style="max-width: 400px;">
            <h2 class="fw-bold mb-4"> 가입 완료!</h2>
            <p class="lead mb-4">
                환영합니다!<br>
                가입이 완료되었습니다.<br>
                로그인 후 서비스를 이용해보세요.
            </p>
            <a href="/login" class="btn btn-primary w-100">
                로그인 하러 가기
            </a>
        </div>
    </section>


    <!-- 토스트 컨테이너  -->
    <div class="toast-container position-fixed
    bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center
    text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">
                    메시지
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- 자바스크립트 연동 모음 -->
    <!-- 부트스트랩 js -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- 재선언&재할당&호이스팅 학습용 및 Toast 함수 추가 js -->
    <script src="../js/test.js"></script>
    <!-- 탐색&가공 성능 테스트 js -->
    <script src="../js/test2.js"></script>
    <!-- 토글 자바스크립트 -->
    <script src="../js/toggle.js"></script>
    <!-- 유효성 체크 자바스크립트 -->
    <script src="../js/input_cheak.js"></script>
    <!-- 암호화 자바스크립트 -->
    <script src="../js/input_sha256.js"></script>

    <script>
        window.addEventListener('load', function () {
            showToast('회원가입 완료!');
        });
