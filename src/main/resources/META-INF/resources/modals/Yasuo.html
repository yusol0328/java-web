<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야스오 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-lg-5 text-center">
                <img src="../images/Yasuo.png" class="img-fluid rounded shadow-lg" alt="야스오"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">야스오 (Yasuo)</h3>
                    <p class="text-muted fs-5">미드 / 난이도: 상</p>
                </div>
            </div>
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 의지의 방식</li>
                    <li class="list-group-item">Q: 강철 폭풍</li>
                    <li class="list-group-item">W: 바람 장벽</li>
                    <li class="list-group-item">E: 질풍검</li>
                    <li class="list-group-item">R: 최후의 숨결</li>
                </ul>
                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    누명을 쓰고 고향을 떠난 야스오는 스승을 죽인 죄를 뒤집어쓴 채 방랑한다.
                    바람의 검술을 완성한 그는 자신을 쫓는 자들과 싸우며 진실을 찾아 떠돌고 있다.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
