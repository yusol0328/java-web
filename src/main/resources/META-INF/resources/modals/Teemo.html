<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티모 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-lg-5 text-center">
                <img src="../images/Teemo.png" class="img-fluid rounded shadow-lg" alt="티모"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">티모 (Teemo)</h3>
                    <p class="text-muted fs-5">탑 / 난이도: 하</p>
                </div>
            </div>
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 게릴라 전술</li>
                    <li class="list-group-item">Q: 실명 사격</li>
                    <li class="list-group-item">W: 재빠른 이동</li>
                    <li class="list-group-item">E: 독 사격</li>
                    <li class="list-group-item">R: 버섯 심기</li>
                </ul>
                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    요들 정찰대 대장인 티모는 반달 시티의 수호를 위해 언제나 임무 중이다.
                    귀여운 외모와 달리 독 버섯과 실명 공격으로 적을 교란하는 무시무시한 전술가다.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
