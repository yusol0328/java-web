<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렉사이 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-lg-5 text-center">
                <img src="../images/RekSai.png" class="img-fluid rounded shadow-lg" alt="렉사이"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">렉사이 (Rek'Sai)</h3>
                    <p class="text-muted fs-5">정글 / 난이도: 중</p>
                </div>
            </div>
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 분노의 여왕</li>
                    <li class="list-group-item">Q: 여왕의 이빨 / 공허 돌진</li>
                    <li class="list-group-item">W: 굴파기 / 지표면으로</li>
                    <li class="list-group-item">E: 사나운 이빨 / 공허 폭발</li>
                    <li class="list-group-item">R: 공허의 돌진</li>
                </ul>
                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    슈리마 사막 지하를 누비는 공허 생명체 렉사이는 본능에 따라 먹이를 사냥한다.
                    그녀가 파놓은 굴은 사막 전역에 뻗어 있으며, 소리로 먹잇감을 추적해 땅속에서 기습한다.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
