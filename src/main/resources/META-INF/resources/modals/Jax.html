<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잭스 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-4">
            <div class="col-lg-5 text-center">
                <img src="../images/Jax.png" class="img-fluid rounded shadow-lg" alt="잭스"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">잭스 (Jax)</h3>
                    <p class="text-muted fs-5">탑 / 난이도: 중</p>
                </div>
            </div>
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 무기 달인</li>
                    <li class="list-group-item">Q: 도약 강타</li>
                    <li class="list-group-item">W: 강화 공격</li>
                    <li class="list-group-item">E: 반격 자세</li>
                    <li class="list-group-item">R: 달인의 기세</li>
                </ul>
                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    진정한 무기 달인인 잭스는 자신에게 맞설 상대를 찾아 방랑한다.
                    너무 강한 나머지 스스로 가로등 기둥을 무기로 쓰며 싸움을 제한할 정도로, 그는 이 세계 최강의 전사 중 하나다.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
