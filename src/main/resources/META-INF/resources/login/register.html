<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <!-- 기존 코드 자리에 연동한 css -->

</head>

<body>
    <!-- 새로운 네비게이션 바 (Navbar) -->

        <div class="container-fluid">

            <!-- [변경] "Navbar" 텍스트 → 다크/라이트 토글 버튼 -->
            <button class="btn border-0" id="themeToggleBtn">
                DARK
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.leagueoflegends.com/ko-kr/news/">뉴스</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.leagueoflegends.com/ko-kr/champions/">챔피온</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../main_page_sub/download.html">다운로드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">로그인</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            외부사이트
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/"
                                    target="_blank">롤공식홈</a></li>
                            <li><a class="dropdown-item" href="https://www.deeplol.gg/aram?hl=ko"
                                    target="_blank">롤전적</a></li>
                            <li>
                                <hr class="dropdown-divider">

                            <li><a class="dropdown-item" href="https://www.youtube.com/@LeagueofLegends-Korea"
                                    target="_blank">간편유튜브</a></li>

                    </li>
                </ul>
                <!-- 서치 폼 불필요하다 생각해 삭제 -->
            </div>
        </div>
    </nav>
    <!-- 회원가입 폼. -->
    <section class="hero d-flex align-items-center
                justify-content-center text-center py-5">
        <div class="container" style="max-width: 480px;">
            <h2 class="fw-bold mb-4">회원가입</h2>
            <form id="registerForm" action="/register_check" method="post">
                <!-- 아이디 -->
                <div class="mb-3 text-start">
                    <label class="form-label">아이디 *</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="4~20자 영문/숫자"
                        required>
                    <div class="invalid-feedback" id="usernameMsg"></div>
                </div>
                <!-- 패스워드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 *</label>
                    <input type="password" class="form-control" id="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
                </div>
                <!-- 패스워드 확인 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 확인 *</label>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="패스워드 재입력" required>
                    <div class="invalid-feedback" id="passwordMsg"></div>
                </div>
                <!-- 이메일 -->
                <div class="mb-3 text-start">
                    <label class="form-label">이메일 *</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com"
                        required>
                    <div class="invalid-feedback" id="emailMsg"></div>
                </div>
                <!-- 연락처 -->
                <div class="mb-3 text-start">
                    <label class="form-label">연락처 *</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="010-0000-0000"
                        required>
                    <div class="invalid-feedback" id="phoneMsg"></div>
                </div>
                <input type="hidden" id="hashedPassword" name="password">
                <button type="button" class="btn btn-primary w-100" onclick="validateAndShowModal()">
                    회원가입
                </button>
            </form>
        </div>
    </section>

    <!-- 가입 확인 모달 (</section> 아래, </body> 위) -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"> 가입 확인</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>아래 정보로 가입하시겠습니까?</p>
                    <table class="table table-dark table-bordered">
                        <tr>
                            <th>아이디</th>
                            <td id="confirmUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="confirmEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="confirmPhone"></td>
                        </tr>
                        <tr>
                            <th>패스워드</th>
                            <td>******** (암호화 전송)</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="submitRegister()">가입하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 토스트 컨테이너 -->
    <div class="toast-container position-fixed
    bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center
    text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">
                    메시지
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- 자바스크립트 연동 모음 -->
    <!-- 부트스트랩 js -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- 재선언&재할당&호이스팅 학습용 및 Toast 함수 추가 js -->
    <script src="../js/test.js"></script>
    <!-- 탐색&가공 성능 테스트 js -->
    <script src="../js/test2.js"></script>
    <!-- 토글 자바스크립트 -->
    <script src="../js/toggle.js"></script>
    <!-- 유효성 체크 자바스크립트 -->
    <script src="../js/input_cheak.js"></script>
    <!-- 암호화 자바스크립트 -->
    <script src="../js/input_sha256.js"></script>

    <script>
        window.addEventListener('load', function () {
            showToast('회원가입 페이지 로딩 완료!');
        });
    </script>

</body>

</html>
